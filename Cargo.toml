[package]
name = "blorp"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for triaging a Fastmail account's mailboxes over JMAP"
license = "MIT"
repository = "https://github.com/tanem/blorp"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util", "rt-multi-thread", "macros"] }
wiremock = "0.6.5"
