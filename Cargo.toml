[package]
name = "blorp"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for triaging a Fastmail account's mailboxes over JMAP"
license = "MIT"
repository = "https://github.com/tanem/blorp"
publish = false

[dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
keyring-core = "1.0.1"
libc = "0.2.191"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util", "rt-multi-thread", "macros"] }
vt100 = "0.16.2"
wiremock = "0.6.5"
